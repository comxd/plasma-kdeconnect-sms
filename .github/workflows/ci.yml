name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate structure and metadata
        run: bash scripts/validate-structure.sh

      - name: Validate main.xml config schema
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('contents/config/main.xml')
          root = tree.getroot()
          ns = {'kcfg': 'http://www.kde.org/standards/kcfg/1.0'}
          entries = root.findall('.//kcfg:entry', ns)
          if not entries:
              print('ERROR: No config entries found')
              exit(1)
          for e in entries:
              print(f'  {e.get(\"name\")} ({e.get(\"type\")})')
          print(f'{len(entries)} config entries validated.')
          "

  lint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev

      - name: Run qmllint
        # qmllint without full Plasma imports will warn about unknown types;
        # we treat these as informational, not blocking.
        continue-on-error: true
        run: |
          if ! command -v qmllint &>/dev/null; then
            echo "::warning::qmllint not found in PATH, skipping lint"
            exit 0
          fi
          echo "::group::qmllint output"
          qmllint contents/ui/*.qml 2>&1
          echo "::endgroup::"

  license:
    name: SPDX license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check SPDX headers in source files
        run: |
          STATUS=0
          while IFS= read -r -d '' f; do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "WARNING: Missing SPDX header in $f"
              STATUS=1
            fi
          done < <(find contents \( -name '*.qml' -o -name '*.js' \) -print0)
          if [ "$STATUS" -eq 0 ]; then
            echo "All source files have SPDX headers."
          else
            echo "::warning::Some files are missing SPDX license headers."
          fi

  build:
    name: Build .plasmoid archive
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gettext (for msgfmt)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Build archive
        run: bash scripts/build-plasmoid.sh

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plasmoid-package
          path: build/*.plasmoid
          retention-days: 14
